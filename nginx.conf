
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
    	listen 80;
    	server_name smovie.com;

    	# Thư mục chứa ReactJS build
    	root /path/to/your/build;
    	index index.html;

    	location / {
        	try_files $uri /index.html;
    	}    

	# Chuyển hướng các file tĩnh của ReactJS
    	location /static/ {
        	root /path/to/your/build;
        	expires 1y;
        	access_log off;
        	add_header Cache-Control "public, max-age=31536000, immutable";
    	}


    	# Gzip compression (tăng tốc tải)
    	gzip on;
    	gzip_types text/css application/javascript image/svg+xml;
    	gzip_vary on;

    	# Cấu hình proxy cho API Django
    	location /api/ {
        	proxy_pass http://127.0.0.1:8000;
        	proxy_set_header Host $host;
        	proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        	proxy_redirect off;
        	proxy_buffering off;
        	proxy_http_version 1.1;
        	proxy_set_header Upgrade $http_upgrade;
        	proxy_set_header Connection "Upgrade";
    	}

	# Cấu hình phục vụ Static Files của Django
    	location /static_sv/ {
        	alias /path/to/your/staticfiles/;
        	autoindex on;
        	access_log off;
        	expires 1y;
    	}
	
    	# Cấu hình truy cập media (Hình ảnh, video...)
    	location /media/ {
        	alias /path/to/your/media/;
        	autoindex on;
        	access_log off;
        	expires max;
    	}

    	# Cấu hình truy cập HLS video streaming
    	location /hls/ {
        	root /path/to/your/media/;
        	add_header Cache-Control no-cache;
        	add_header Access-Control-Allow-Origin *;
        	types {
            		application/vnd.apple.mpegurl m3u8;
            		video/mp2t ts;
        	}
        	autoindex on; # Hiển thị danh sách file để kiểm tra dễ dàng
    	}



	
        #location / {
        #    root   html;
        #    index  index.html index.htm;
        #}

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

