{% extends "admin/movies/reports/base_report.html" %}

{% block report_content %}
<div class="report-section">
    <h2>Diễn viên tham gia nhiều phim nhất</h2>
    
    <table class="report-table">
        <thead>
            <tr>
                <th>Diễn viên</th>
                <th>Số phim tham gia</th>
            </tr>
        </thead>
        <tbody>
            {% for actor in top_actors %}
            <tr>
                <td>{{ actor.actor__name }}</td>
                <td>{{ actor.count }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">Không có dữ liệu</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
